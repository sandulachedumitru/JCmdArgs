name: Maven Verify

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          java -version
          bash ./mvnw -version

      - name: Show Java and Maven versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          java -version
          .\mvnw.cmd -version

      - name: Run tests and verify package (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Run tests and verify package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify
