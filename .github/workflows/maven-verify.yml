name: Maven Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Java 21 / Maven Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        shell: bash
        run: |
          java -version
          bash ./mvnw -version

      - name: Run tests and verify package
        shell: bash
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
